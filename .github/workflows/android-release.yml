name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag for the release (e.g. v0.1.0)
        required: true
        type: string
      release_notes:
        description: Release notes (markdown)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks

      - name: Write android/key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret ${name}"
              exit 1
            fi
          done
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Write .env.local for release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret ${name}"
              exit 1
            fi
          done
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "API_BASE_URL=${API_BASE_URL}"
          } > .env.local

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Brand release APK
        id: apk
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          SAFE_TAG="${RELEASE_TAG//\//-}"
          APK="build/app/outputs/flutter-apk/learn-sphere-${SAFE_TAG}.apk"
          if [[ ! -f "${SRC}" ]]; then
            echo "Expected ${SRC} not found"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          cp "${SRC}" "${APK}"
          echo "path=${APK}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: LearnSphere ${{ inputs.release_tag }}
          body: |
            ${{ inputs.release_notes }}

            ---
            Built from commit ${{ github.sha }}.
            APK: `learn-sphere-${{ inputs.release_tag }}.apk` (same version as this release tag). Install on Android (sideload); not published to Play Store.
          draft: true
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
