name: learnsphere_mobile
description: Native Android and iOS client for LearnSphere.
publish_to: "none"
version: 0.2.1+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  cross_file: ^0.3.4
  dio: ^5.8.0+1
  file_picker: ^10.1.2
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  livekit_client: ^2.10.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  record: ^6.0.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.0
  uuid: ^4.5.1
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  dice_bear: ^1.0.4
  fl_chart: ^0.70.2
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#F7F5F2"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.local
    - assets/images/app_icon.png
